name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build PopUp.sln --configuration Release

      - name: Test
        run: dotnet test PopUp.sln --configuration Release --no-build

      # End-to-end check: the sample solution contains deliberate violations, so `check` must
      # find them and exit with code 3. Any other exit code means something regressed.
      - name: Check the sample's architecture rules
        run: |
          dotnet build samples/ShopSample/ShopSample.sln
          set +e
          dotnet run --project src/PopUp.Cli --configuration Release --no-build -- \
            check samples/ShopSample/ShopSample.sln --sarif popup.sarif
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "Expected exit code 3 (violations found) but got $code"
            exit 1
          fi

      - name: Generate the sample's HTML report
        run: |
          dotnet run --project src/PopUp.Cli --configuration Release --no-build -- \
            report samples/ShopSample/ShopSample.sln -o popup-report.html

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: popup-reports
          path: |
            popup.sarif
            popup-report.html

  # The desktop app is a Windows (WPF) program, so it's published on a Windows runner. The result is
  # attached to the run as a download: PopUp.exe plus the BuildHost folders it needs.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish PopUp.exe
        run: dotnet publish src/PopUp.Desktop --configuration Release --runtime win-x64 --output artifacts/PopUp

      - name: Upload the desktop app
        uses: actions/upload-artifact@v7
        with:
          name: PopUp-desktop-win-x64
          path: artifacts/PopUp
